<script src="journey-core.js"></script><script>
/* Local single-file edition. All inline handlers are exposed on window. */
const KEY='life-lost-found-guided-v5';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({...JourneyCore.branch(),version:6,started:false,stage:1,unlocked:1,minutes:0,clues:[],witnesses:[],mini:{},talk:0,repairs:0,talkOutcome:'',budgetStep:0,basic:false,vouchers:false,budgetDone:false,habit:'',trigger:'',planStart:'',stamps:Array(7).fill(null),profile:'N',complete:false,openingChoice:'',route:'',delay:false,gapAck:false});
let s=fresh(),demo=false,beforeDemo=null,toastTimer,activeMini='',pauseStep=0,returnFocus=null;
const saveSession=JourneyCore.load({getItem:k=>localStorage.getItem(k)},fresh());s=saveSession.state;
function save(){if(demo)return;if(saveSession.status==='recovery'){$('save-status').textContent='原儲存檔已保留；目前進度未儲存';return}if(saveSession.status==='unavailable'){$('save-status').textContent='進度將不會儲存；完成後請下載行動卡';return}try{localStorage.setItem(KEY,JSON.stringify(s));saveSession.status='ready';$('save-status').textContent='進度已存喺呢個瀏覽器'}catch{saveSession.status='unavailable';$('save-status').textContent='進度將不會儲存；完成後請下載行動卡'}window.journeySaveStatus?.()}
function time(){const m=Math.min(70,Number(s.minutes)||0);return s.stage>=3?'23:25':`${22+Math.floor((10+m)/60)}:${String((10+m)%60).padStart(2,'0')}`}
function spend(n){s.minutes=Math.min(70,(Number(s.minutes)||0)+n)}
function hkDate(){const p=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}`}
function elapsed(){return s.planStart?Math.max(0,Math.floor((Date.parse(hkDate()+'T12:00:00Z')-Date.parse(s.planStart+'T12:00:00Z'))/86400000)):-1}
function btn(label,fn,type=''){return `<button class="btn btn-3d ${type}" onclick="${fn}">${label}</button>`}
function choice(text,fn,sub='',selected=false){return `<button class="choice ${selected?'selected':''}" onclick="${fn}"><strong>${text}</strong>${sub?`<small>${sub}</small>`:''}</button>`}
function notify(t){clearTimeout(toastTimer);$('toast').textContent=t;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3300)}
window.showToast=notify;
window.spawnFloatingBadge=function(t,c,e){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const n=document.createElement('div');n.className='float-badge';n.textContent=t;n.style.left=Math.min(innerWidth-180,Math.max(15,e?.clientX||innerWidth/2))+'px';n.style.top=Math.max(30,e?.clientY||150)+'px';document.body.append(n);setTimeout(()=>n.remove(),1400)};
window.fireConfetti=function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<24;i++){const n=document.createElement('i');n.className='confetti';n.style.cssText=`top:-20px;left:${Math.random()*100}%;background:${['#edb64d','#da713b','#8aa98e','#d998a0'][i%4]};animation-delay:${Math.random()*.5}s`;document.body.append(n);setTimeout(()=>n.remove(),2800)}};
function modal(title,html){returnFocus=document.activeElement;$('modal-title').textContent=title;$('modal-body').innerHTML=html;if(!$('dialog').open)$('dialog').showModal()}
window.closeModal=function(){$('dialog').close();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true})};
function render(focus=false){$('clock').textContent=time();$('clock').title='故事時間，調查會推進；唔係真實倒數。';$('balance').textContent=s.clues.includes('phone')?'$50.00':'待查';$('clue-count').textContent=s.clues.length+'/4';$('demo').hidden=!demo;$('chapters').innerHTML=[1,2,3,4].map((n,i)=>`<button title="${['失物開箱','拼出原因','海濱對話','聽朝之後'][i]}" aria-label="第${n}幕：${['失物開箱','拼出原因','海濱對話','聽朝之後'][i]}" ${!s.started||n>s.unlocked?'disabled':''} aria-current="${n===s.stage&&s.started?'step':'false'}" class="chapter ${s.started&&s.stage===n?'active':n<s.unlocked?'done':''}" onclick="window.jumpToStage(${n})">${n}</button>`).join('');$('app').innerHTML=!s.started?opening():s.stage===1?desk():s.stage===2?investigation():s.stage===3?conversation():planning();$('app').classList.remove('scene-arrive');void $('app').offsetWidth;$('app').classList.add('scene-arrive');save();if(focus){$('app').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
function opening(){return `<section class="scene night"><div class="copy"><div class="kicker">今晚 22:10 ／ 最後一更</div><h1>「唔好再<br>搵我啦。」</h1><p class="lead">阿俊留低四件失物，仲有一封未覆嘅訊息。</p><p>佢話，23:30 會離開觀塘海濱。你係今晚當值嘅認領員。見面之前，你想先弄清楚乜？</p><div class="actions">${btn('打開佢留低嘅箱','window.startShift()')}</div><div class="tags"><span class="tag">四幕互動故事</span><span class="tag">一個人／同朋友一齊</span><span class="tag">可以隨時停低</span></div></div><div class="visual"><div class="phone"><div class="phone-top"><span>22:10</span><span>▂▄▆　4% ▰</span></div><small style="color:#cabda9">阿俊 · 22:08</small><div class="message">啲嘢唔使還畀我。<br>我都唔知點同你講。<small>已讀</small></div><div class="typing">● ● ●</div><div class="silence">對方停止輸入<br><br>箱蓋寫住：#0409 ／ 阿俊</div></div></div></section>`}
window.startShift=function(){s.started=true;render(true)};
const evidence={phone:{icon:'📱',name:'碎屏手機',title:'$50。仲有十四封訊息。',quote:'可用餘額　HK$50.00',body:'螢幕裂咗，銀行通知仲睇得清。十四封新訊息，都係「即批貸款」推銷。',detail:'餘額只話到佢此刻有幾多錢。收入、欠款同幾時出糧，仲未知道。',question:'你會點回覆佢？',choices:['「我想先聽你講，唔會替你亂作決定。」','「得五十蚊？你平時到底點用錢？」'],right:0,reveal:'你傳咗一句唔責備嘅說話。暫時未有回覆。'},bill:{icon:'🧾',name:'凌晨帳單',title:'02:15。十一筆付款。',quote:'當晚課金　$8,000',body:'同一隻遊戲，十一筆交易。最後一筆付款之前，手機有一通未接來電。',detail:'帳單話到花咗幾多，未話到點解。你想搵到付款之前發生過乜。',question:'邊一條問題，會帶你再行近一步？',choices:['佢抽中咩稀有角色？','付款之前，佢經歷咗啲乜？'],right:1,reveal:'你喺案情簿寫低：「情緒先出現，定付款先出現？」'},shoes:{icon:'👟',name:'限量波鞋',title:'每月 $300，好似負擔得起。',quote:'$3,600 ÷ 12 期',body:'鞋盒底仲壓住四張分期確認信。佢寫咗「下個月再算」，但五筆都未供完。',detail:'一筆月供唔等於全部承諾。五筆一齊扣，先見到生活仲剩幾多位。',question:'你會拎走邊條線索？',choices:['五筆月供嘅總額，同扣款日期。','只記低鞋每月三百蚊。'],right:0,reveal:'你保留晒五張確認信。阿媽可能知道佢出糧之後嘅情況。'},note:{icon:'📝',name:'摺埋嘅字條',title:'背面，仲有一句。',quote:'「我撐唔住。」',body:'你將摺角攤開。背面寫住：「其實我試過改。」下面係觀塘海濱，3號觀景亭。',detail:'呢句說話唔係帳單。係一個人仲未講完嘅故事。',question:'你會帶住邊個問題去見佢？',choices:['點樣令佢承認自己錯？','佢試過啲乜？最難行落去係邊一步？'],right:1,reveal:'你決定先聽完佢嘅故事，再同佢諗下一步。'}};
function desk(){const all=s.clues.length===4;return `<section class="scene"><div class="copy"><div class="kicker">第一幕 ／ 留低嘅嘢</div><h2>${all?'佢唔係冇試過。<br>你仲欠一個原因。':'箱入面，<br>有四件未講完嘅事。'}</h2><p>${all?'四件失物都睇過。依家可以聯絡識佢嘅人，查清楚帳單背後發生咗乜。':'先揀一件。每件失物只需要你作一個判斷。'}</p><div class="tags"><span class="tag">已整理 ${s.clues.length}／4</span><span class="tag">每次調查 · 故事時間 +5 分鐘</span></div>${all?`<div class="response good">手機震咗一下。<br>阿俊：「唔好同我講『早知就唔好買』。」</div><div class="actions">${btn('搵人問多一句','window.advanceInvestigation()')}</div>`:'<p class="subtle">你可以改變調查次序。已整理嘅證物可以隨時重看。</p>'}</div><div class="visual desk"><div class="desk-label">LOST PROPERTY ／ #0409</div><div class="objects">${Object.entries(evidence).map(([k,v])=>`<button class="object" onclick="window.inspectClue('${k}')" aria-label="${v.name}${s.clues.includes(k)?'，已整理':''}">${s.clues.includes(k)?'<span class="found">✓ 已整理</span>':''}<span class="icon">${v.icon}</span><strong>${v.name}</strong></button>`).join('')}</div></div></section>`}
window.inspectClue=function(k){const e=evidence[k];if(!e)return;modal(e.name,`<div class="kicker">失物 #0409 ／ ${esc(e.name)}</div><h2>${e.title}</h2><div class="clue-quote">${e.quote}</div><p>${e.body}</p><p class="subtle">${e.detail}</p><div class="rule"></div>${s.clues.includes(k)?`<div class="response good">${e.reveal}</div><div class="actions">${btn('放返案情簿','window.closeModal()','secondary')}</div>`:`<h3>${e.question}</h3>${e.choices.map((a,i)=>choice(a,`window.resolveClue('${k}',${i})`)).join('')}<div id="evidence-feedback" class="response" role="status"></div>`}`)};
window.resolveClue=function(k,i){const e=evidence[k];if(i!==e.right){$('evidence-feedback').className='response warn';$('evidence-feedback').textContent=k==='phone'?'你刪返呢句。單憑餘額，未知道一個人經歷咗乜。試下留一個佢願意開口嘅位置。':'呢條線索仲未足夠作出呢個判斷。翻睇件失物，再揀一次。';return}if(!s.clues.includes(k)){s.clues.push(k);spend(5)}save();render();$('modal-body').innerHTML=`<div class="big-icon">${e.icon}</div><h2>${e.title}</h2><div class="response good">${e.reveal}</div><div class="actions">${btn(s.clues.length===4?'四件失物已整理':'放返枱面，睇下一件','window.closeModal()')}</div>`};
window.advanceInvestigation=function(){if(s.clues.length<4)return notify('仲有失物未整理。');s.stage=2;s.unlocked=Math.max(s.unlocked,2);render(true)};
const witnesses=[{name:'阿媽',icon:'👩',role:'知道出糧之後嘅事',quote:'「佢話今個月一定儲。但幾筆分期一齊扣，連生活費都未計，已經冇咗一大截。」',hook:'五張分期信，依家可以拼埋。',mini:'instalments',profile:'D'}, {name:'阿欣',icon:'👩‍🦱',role:'最近一次約會嘅人',quote:'「我冇叫佢次次請。佢怕我覺得佢冇能力，連飲品、外賣、的士都唔敢話想慳。」',hook:'每張收據都細。但一個月呢？',mini:'coins',profile:'A'}, {name:'阿凱',icon:'🧑',role:'凌晨打過電話畀佢',quote:'「嗰晚佢畀上司責備。我打畀佢，佢冇聽。之後佢話，抽卡嗰陣先覺得自己贏返啲嘢。」',hook:'付款之前，原來有一段委屈。',mini:'pause',profile:'B'}, {name:'阿May',icon:'👩‍💼',role:'見過佢張購物車',quote:'「佢話免運即係慳錢。其實啲加購品，仲喺袋入面未拆。」',hook:'幫佢揀返真正需要嗰張單。',mini:'shipping',profile:'C'}];
function investigation(){const ready=s.witnesses.length>=2&&Object.keys(s.mini).length>=1;return `<section class="focus"><div class="kicker">第二幕 ／ 帳單背後</div><h2>${ready?'你知道嘅，<br>已經多過一個餘額。':'同一個阿俊，<br>四個人見到四個角度。'}</h2><p class="intro">${ready?'仲可以問多一個人，或者帶住線索出發。你問過邊個，會影響海濱嗰段對話。':'先問兩個人，再親手解開一個帳單疑點。其他調查，由你決定。'}</p><div class="surface">${witnesses.map((w,i)=>choice(`<span class="witness"><span class="portrait">${w.icon}</span><span>${w.name}${s.witnesses.includes(i)?' <span class="badge">已聯絡</span>':''}<small>${w.role}</small></span>`,`window.hearWitness(${i})`)).join('')}<div class="section-foot"><p>${s.witnesses.length} 個角度 · ${Object.keys(s.mini).length} 個疑點已解開</p>${ready?btn('帶住線索去海濱','window.arrive()'):''}</div></div>${ready?'<p class="subtle">繼續調查會推進故事時間；阿俊可能等得更焦急。線索唔會因為你讀得慢而消失。</p>':''}<div class="actions">${btn('看看其他帳單疑點','window.extraMinis()','secondary')}${btn('五張消費提醒卡','window.profiles()','secondary')}</div></section>`}
window.hearWitness=function(i){const w=witnesses[i];if(!w)return;if(!s.witnesses.includes(i)){s.witnesses.push(i);spend(10)}render();modal(w.name,`<div class="witness"><span class="portrait">${w.icon}</span><div><div class="kicker" style="margin:0">語音訊息</div><h3>${w.name}</h3></div></div><div class="bubble">${w.quote}</div><p class="subtle">${w.hook}</p><div class="actions">${btn(s.mini[w.mini]?'重看呢個疑點':'查清呢個疑點',`window.openMini('${w.mini}')`)}${btn('先問另一個人','window.closeModal()','secondary')}</div>`)};
window.extraMinis=function(){modal('自選調查',`<p>解開一個就可以帶線索出發。想再查先繼續。</p>${[['coins','🧋 三張細額收據'],['shipping','🛍️ 免運購物車'],['instalments','👟 五筆月供'],['pause','⏸️ 凌晨付款之前']].map(([k,t])=>choice(t+(s.mini[k]?' ✓':''),`window.openMini('${k}')`)).join('')}`)};
window.openMini=function(k){if(!['coins','shipping','instalments','pause'].includes(k))return;activeMini=k;pauseStep=0;let h='';if(k==='coins')h=`<h2>三張單，<br>都係「幾十蚊啫」。</h2><div class="stats"><div class="stat"><small>飲品</small><strong>$35</strong></div><div class="stat"><small>外賣附加費</small><strong>$25</strong></div><div class="stat"><small>短途的士</small><strong>$40</strong></div></div><p>如果每日重複，30 日會係幾多？</p><label for="sum">你嘅估算 · HK$</label><input id="sum" class="input" type="number" min="0" inputmode="numeric">${btn('攤開一個月','window.answerSum(3000)')}`;
if(k==='shipping')h=`<h2>免運，真係慳咗？</h2><p class="subtle">佢只需要 $180 嘅貨品。滿 $300 免運。</p>${choice('只買需要嗰件 · $205',"window.answerShipping(0)",'貨品 $180 ＋ 運費 $25')}${choice('加購未需要嘅嘢 · $300',"window.answerShipping(1)",'貨品 $300 ＋ 運費 $0')}`;
if(k==='instalments')h=`<h2>每筆都細。<br>加埋，仲細唔細？</h2><div class="table-wrap"><table><tbody>${[['波鞋',300],['耳機',450],['手機',1250],['電腦',1600],['手錶',900]].map(([n,v])=>`<tr><td>${n}</td><td>$${v}／月</td></tr>`).join('')}</tbody></table></div><p class="subtle">故事假設免息、無其他費用。</p><label for="sum">五筆每月合共 · HK$</label><input id="sum" class="input" type="number" min="0" inputmode="numeric">${btn('照一照下個月','window.answerSum(4500)')}`;

function pauseScene(){const scenes=[['上司責備完，佢開咗抽卡頁。你會先做乜？',['即刻買，開心咗先算','離開付款頁，先停十分鐘'],1],['停低之後，佢話：「我只係想贏返一次。」',['問：你而家想被理解，定真係想要個角色？','話佢冇自制力'],0],['佢話：「其實我想有人聽我講。」',['叫佢一世都唔准買嘢','陪佢傾十句，再決定買唔買'],1]];const [q,a]=scenes[pauseStep];return `<div class="kicker">付款前嘅空隙 ${pauseStep+1}／3</div><h2>${q}</h2>${a.map((t,i)=>choice(t,`window.answerPause(${i})`)).join('')}`}
window.answerPause=function(i){const right=[1,0,1][pauseStep];if(i!==right)return feedback('mini-feedback','試下先認出佢需要乜，唔急住付款，亦唔急住責備。',true);if(pauseStep<2){pauseStep++;$('modal-body').innerHTML=pauseScene()+'<div id="mini-feedback" class="response" role="status"></div>'}else finishMini('pause','情緒唔係錯。先停低、認出需要，再加一個付款以外嘅回應。')};
function finishMini(k,text){if(!s.mini[k]){s.mini[k]=true;spend(10);render()}$('modal-body').innerHTML=`<div class="kicker">線索接上了</div><h2>${{coins:'細數，都有重量。',shipping:'優惠，唔係需要。',instalments:'下個月，已經畀人訂咗位。',pause:'佢想要嘅，未必係一件貨品。'}[k]}</h2><div class="response good">${text}</div><p class="subtle">同伴討論：如果你係阿俊，邊一筆想保留？邊一步願意改？</p><div class="actions">${btn('帶住呢條線索','window.closeModal()')}</div>`;window.spawnFloatingBadge('多睇到一層')}

window.profiles=function(){modal('你想帶走邊個提醒？',`<p>阿俊身上有五個先兆。你可以只揀一個自己想試嘅改變。</p>${Object.entries(profiles).map(([k,p])=>choice(`${p[0]} ${p[1]}`,`window.selectSceneOption('${k}')`,p[2],s.profile===k)).join('')}`)};

window.arrive=function(){if(s.witnesses.length<2||Object.keys(s.mini).length<1)return notify('先問兩個人，再解開一個帳單疑點。');modal('房間傳嚟一張相',`<div class="big-icon">📒</div><div class="kicker">你出發之前</div><h2>全新嘅記帳簿。<br>只寫咗三日。</h2><p class="subtle">旁邊疊住十二封未拆嘅銀行信。第三日，佢仲寫住：『今次一定做到。』</p><div class="response">字條背面嗰句『其實我試過改』，原來係真嘅。</div><div class="actions"><button class="btn" onclick="window.goPromenade()">帶埋本簿，去見佢</button></div>`)};
window.goPromenade=function(){s.stage=3;s.unlocked=Math.max(s.unlocked,3);s.route=s.minutes>=60?'late':'early';window.closeModal();render(true)};
function junLine(){if(s.talk===0){if(s.repairs&&s.talkOutcome==='repair')return '「你又係嚟教訓我？……咁我唔講喇。」';return s.route==='late'?'「我以為你都唔會嚟。我唔想再畀人話亂使錢。」':'「你真係嚟咗。我唔想再畀人話亂使錢。」'}if(s.talk===1)return s.witnesses.includes(2)?'「阿凱同你講咗？嗰晚我只係想有樣嘢做得好。點知更加衰。」':s.witnesses.includes(1)?'「阿欣其實冇迫我。但我怕話冇錢，會畀人睇低。」':'「我知啲帳單唔會自己消失。但我一打開，就覺得自己好失敗。」';if(s.talk===2)return '「本記帳簿寫咗三日就停。我係咪根本改唔到？」';return '「你唔使幫我還晒。可唔可以先陪我，諗聽朝點過？」'}
function conversation(){const repaired=s.talkOutcome==='repair';let choices='';if(s.talk===0){choices=repaired?choice('「對唔住，我講得太快。我想聽你而家最擔心乜。」',"window.talkChoice('repair')"):choice('「我唔急住判斷你。你而家最驚邊件事？」',"window.talkChoice('listen')")+choice('「早知就唔好買咁多，你自己搞成咁。」',"window.talkChoice('scold')");}else if(s.talk===1){const line=s.witnesses.includes(2)?'「你嗰晚好委屈。抽卡似乎幫你頂住咗一陣，但帳單仲喺度。」':s.witnesses.includes(1)?'「原來你怕失去關係。可以一齊講預算，唔使靠請客先留住人。」':'「一個餘額唔代表你係點嘅人。我想同你睇清楚，唔係評你分。」';choices=choice(line,"window.talkChoice('connect')")+choice('「你有收入，應該冇乜大問題啦。」',"window.talkChoice('dismiss')");}else if(s.talk===2){choices=choice('「本簿證明你試過。唔使補到完美，下一筆重新開始得唔得？」',"window.talkChoice('restart')")+choice('「不如覆嗰啲即批貸款，先頂住。」',"window.talkChoice('loan')");}return `<section class="scene"><div class="copy"><div class="kicker">第三幕 ／ 觀塘海濱 · 23:25</div><h2>${s.talk>=3?'今晚，唔使解決晒。<br>先令聽朝有下一步。':s.talk===0?'佢見到你，<br>先收埋咗個電話。':s.talk===1?'用你查到嘅，<br>問一句貼近佢嘅說話。':'三日，<br>唔代表只可以得三日。'}</h2><div class="bubble" aria-live="polite">${junLine()}</div>${choices}${s.talk>=3?`<div class="actions">${btn('坐低，一齊排聽朝','window.beginPlan()')}</div>`:''}${s.talkOutcome==='hint'?'<div class="response warn">阿俊避開眼神，冇接住講。你仲可以換一句，修補對話。</div>':s.talkOutcome==='loan'?'<div class="response warn">「再借，係咪只會將問題推到下個月？」未核實還款能力，先唔作新借貸決定。</div>':''}<p class="subtle">可以先望開畫面，用自己嘅說話講。唔使擲骰，唔使讀得完美。</p><button class="textbtn" onclick="window.narratorMode()">改用旁白方式</button></div><div class="visual"><div class="jun-art"><span class="jun-figure">${s.talk>=3?'🧑‍🤝‍🧑':s.talk===0?'🧍':'🧎'}</span><span class="location">KWUN TONG ／ 3號觀景亭</span></div><p class="subtle">${s.witnesses.includes(2)?'你帶住：阿凱嘅凌晨來電。':s.witnesses.includes(1)?'你帶住：阿欣其實願意一齊慳。':'你帶住：四件失物，同未講完嘅故事。'}</p><p class="subtle">${s.talk>=3?'阿俊願意同你一齊諗下一步。':`對話 ${Math.min(s.talk+1,3)}／3 · ${repaired?'先修補，再繼續':'先聽，先問'}`}</p></div></section>`}
window.talkChoice=function(k){if(k==='scold'&&s.talk===0){s.repairs++;s.talkOutcome='repair';render();return}if(k==='dismiss'&&s.talk===1){s.talkOutcome='hint';render();return}if(k==='loan'&&s.talk===2){s.talkOutcome='loan';render();return}if((s.talk===0&&['listen','repair'].includes(k))||(s.talk===1&&k==='connect')||(s.talk===2&&k==='restart')){s.talk++;s.talkOutcome='';render(true);window.spawnFloatingBadge('佢繼續講落去')}};
window.narratorMode=function(){modal('用旁白，唔使演危機情緒',`<p>你坐喺阿俊旁邊，先聽需要，唔急住判斷。你將失物同佢嘅說話連起來，陪佢了解可信任嘅人同專業支援。</p><div class="response">阿俊望返本只寫咗三日嘅記帳簿：「咁……由下一筆開始？」</div><div class="actions">${btn('由下一步繼續','window.completeNarrator()')}</div>`)};

function cashflow(){return JourneyCore.project(s).rows}
function planning(){if(s.complete)return ending();if(!s.budgetDone){const rows=cashflow(),day=Math.min(s.budgetStep,2),r=rows[day],gap=Math.max(0,-Math.min(...rows.map(x=>x.balance)));return `<section class="focus"><div class="kicker">第四幕 ／ 先過好聽朝</div><h2>${day===0?'「我有六百蚊人工未出。」':day===1?'「有收入，點解第二日會唔夠？」':'「原來唔只睇一星期總數。」'}</h2><p class="intro">$600 會喺 Day ${s.delay?5:3} 到帳。手上只得 $50。先排基本生活，唔靠新借貸。</p><div class="surface"><div class="kicker">Day ${r.day} ／ ${r.income?'人工到帳':'人工未到手'}</div><div class="cash ${r.balance<0?'negative':''}">$${r.balance}</div><p class="muted">呢日完結後嘅可用現金</p><div class="stats"><div class="stat"><small>餐費</small><strong>$${r.food-r.voucher}</strong></div><div class="stat"><small>交通</small><strong>$${r.travel}</strong></div><div class="stat"><small>今日入帳</small><strong>$${r.income}</strong></div></div>${day<2?`${choice('基本餐費 $30 ＋ 交通 $12',"window.adjustBudget('basic')",'先保基本需要；故事簡化為每日同一安排。',s.basic)}${choice('保留原本餐費 $45 ＋ 交通 $28',"window.adjustBudget('comfort')",'',!s.basic)}${choice('查一查：原來仲有兩張已持有嘅 $30 飯券',"window.adjustBudget('vouchers')",'只可用於 Day 1、Day 2，唔係新增現金。',s.vouchers)}`:`<div class="response ${gap?'warn':'good'}">${gap?`最早 Day ${rows.find(x=>x.balance<0).day} 出現缺口，最大差 $${gap}。全週有剩，唔代表每日夠用。`:`基本需要同收入日期排好後，七日每日都冇負數，最後剩 $${rows[6].balance}。`}</div>`}<div id="budget-feedback" class="response" role="status"></div><div class="actions">${day<2?btn(day===0?'睇埋第二日':'到出糧嗰日','window.nextBudget()'):gap?btn('返第一日，重新安排',"window.reworkBudget()",'secondary'):btn('阿俊嘅下一步，排好咗','window.acceptBudget()')}${btn('攤開七日帳目','window.fullBudget()','secondary')}</div></div><p class="subtle">每日先保餐費同必要交通。若現有資源仍然唔夠，應先確認支援同付款安排。</p></section>`}return planCard()}
window.adjustBudget=function(k){if(k==='basic')s.basic=true;if(k==='comfort')s.basic=false;if(k==='vouchers')s.vouchers=!s.vouchers;s.gapAck=false;render()};
window.nextBudget=function(){s.budgetStep=Math.min(2,s.budgetStep+1);render(true)};
window.reworkBudget=function(){s.budgetStep=0;render(true)};

window.fullBudget=function(){const rows=cashflow(),gap=Math.max(0,-Math.min(...rows.map(x=>x.balance)));modal('七日現金流',`<p>起始 $50。Day ${s.delay?5:3} 入帳 $600。Day 5 電話費 $50。</p><div class="table-wrap"><table><thead><tr><th>日</th><th>入帳</th><th>當日支出</th><th>日終現金</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.day}</td><td>$${r.income}</td><td>$${r.cost}</td><td class="${r.balance<0?'negative':''}">$${r.balance}</td></tr>`).join('')}</tbody></table></div><p class="subtle">支出＝餐費－適用飯券＋交通＋當日電話費。全屬故事試算。</p><details style="margin-top:20px"><summary>多走一步：如果人工遲兩日？</summary><div class="actions">${btn(s.delay?'改返 Day 3 到帳':'改為 Day 5 到帳','window.delayPay()','secondary')}</div>${s.delay&&gap?`<div class="response warn">仍有 $${gap} 現金缺口。呢個版本未係可執行預算。</div>${choice('先確認收入日期、可用支援同可協商付款安排',"window.ackGap()",'唔會假設支援一定批出，亦唔會憑空加錢。')}`:''}</details>`)};
window.delayPay=function(){s.delay=!s.delay;s.gapAck=false;s.budgetDone=false;render();window.fullBudget();$('modal-body').querySelector('details').open=true};
window.ackGap=function(){s.gapAck=true;s.budgetDone=true;save();window.closeModal();render(true);notify('已保留缺口；支援未落實之前，呢份預算仍未可以執行。')};
function planCard(){const p=profiles[s.profile]||profiles.N;return `<section class="focus"><div class="kicker">阿俊嘅故事之後 ／ 輪到自己</div><h2>唔使一晚變成另一個人。<br>只揀一件，聽日做得到嘅事。</h2><p class="intro">本記帳簿只寫咗三日。第 4 日唔追求完美，只練習再開始。</p><div class="surface"><span class="badge">${p[0]} ${p[1]}</span><button class="textbtn" onclick="window.profiles()">換個提醒</button><form onsubmit="event.preventDefault();window.savePersonalPlan()"><label for="habit">我會……</label><input class="input" id="habit" maxlength="120" value="${esc(s.habit)}" placeholder="${esc(p[3])}" required><label for="trigger">喺咩時候做？</label><input class="input" id="trigger" maxlength="120" value="${esc(s.trigger)}" placeholder="例如：每晚刷牙之後"><div class="actions"><button class="btn green" type="submit">${s.planStart?'更新行動':'由今日開始七日'}</button></div></form>${s.planStart?stamps():''}<div class="actions">${btn('下載行動卡','window.downloadActionCard()','secondary')}${s.planStart?btn('認領返自己嘅下一步','window.finishCase()'):''}</div></div><p class="subtle">唔使填戶口、收入或者欠款。行動卡同打卡只存喺呢個瀏覽器。</p></section>`}

window.savePersonalPlan=function(){const habit=$('habit').value.trim(),trigger=$('trigger').value.trim()||'每晚刷牙之後';if(!habit)return notify('揀一件細到做得到嘅事。');s.habit=habit.slice(0,120);s.trigger=trigger.slice(0,120);s.planStart=s.planStart||hkDate();render();window.spawnFloatingBadge('由下一筆開始')};

function ending(){return `<section class="scene"><div class="copy"><div class="kicker">#0409 ／ 已有人同行</div><h2>「本簿，<br>我想拎返。」</h2><p>阿俊冇突然多咗錢。帳單亦未消失。但佢願意打開本簿，同一個信任嘅人，睇下一筆。</p><div class="response good">你帶畀佢嘅：<br>${s.witnesses.includes(2)?'睇見付款背後嘅委屈。':s.witnesses.includes(1)?'睇見佢想保住嘅關係。':'先聽需要，再作判斷。'}<br>${s.repairs?'講錯咗，仍然願意修補。':'留低一個可以繼續講嘅位置。'}<br>${s.gapAck?'唔假裝缺口已經解決，先確認支援。':'將未來收入，同今日可用嘅錢分清楚。'}</div><div class="actions">${btn('保留我嘅行動卡','window.downloadActionCard()')}${btn('返去七日打卡','window.returnPlan()','secondary')}</div><p class="subtle">最後同同伴講一句：你曾經以為阿俊係點嘅人？依家有咩唔同？</p></div><div class="visual surface"><div class="big-icon">📒</div><div class="kicker">唔係清零，而係重新開始</div><h3>三日之後，<br>仲有第四日。</h3><div class="rule"></div><p>當 ${esc(s.trigger)}，<br>我會 ${esc(s.habit)}。</p><div class="tags"><span class="tag">七日後，再睇有冇做到</span></div></div></section>`}

window.downloadActionCard=function(){if(!s.planStart)return notify('先揀一個想試嘅小行動。');const rows=cashflow(),gap=Math.max(0,-Math.min(...rows.map(x=>x.balance)));const lines=['人生失物認領處｜七日行動卡',demo?'【評審示範，並非真實完成紀錄】':'本機玩家計劃','開始：'+s.planStart,'當 '+s.trigger+'，我會 '+s.habit+'。','提醒：'+(profiles[s.profile]||profiles.N)[1],'',...s.stamps.map((x,i)=>`Day ${i+1}${i===3?' 三日之後，再開始':''}：${x?(demo?'示範':(x.backfill?'補記 ':'已記錄 ')+x.date):'未記錄'}`),'','故事現金流：'+(gap?'仍有 $'+gap+' 缺口，須先確認支援，未可直接執行。':'每天未出現負數，七日後剩 $'+rows[6].balance+'。'),'','記帳中斷，可以由下一筆重新開始。','計劃只存喺本機；唔係財務或心理診斷。','債務輔導資料：https://www.ifec.org.hk/web/tc/moneyessentials/debts-and-borrowing/manage-exist-debt/counselling.page'];const url=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='人生失物認領處_七日行動卡'+(demo?'_示範':'')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.jumpToStage=function(n,judge=false){if(!Number.isInteger(n)||n<1||n>4)return;if(judge)enterDemo();if(n>s.unlocked&&!demo)return notify('跟住眼前嘅線索先行落去。');s.started=true;s.stage=n;render(true)};
window.openJournal=function(){modal('案情簿 ／ 你真正知道嘅事',`${s.clues.length?s.clues.map(k=>`<div class="journal-entry"><strong>${evidence[k].icon} ${evidence[k].name}</strong><p>${evidence[k].quote}。${evidence[k].detail}</p><button class="textbtn" onclick="window.inspectClue('${k}')">重看證物 ↗</button></div>`).join(''):'<p>箱仲未打開。先由一件失物開始。</p>'}${s.witnesses.length?'<div class="rule"></div><h3>聽過嘅說話</h3>'+s.witnesses.map(i=>`<div class="journal-entry"><strong>${witnesses[i].name}</strong><p>${witnesses[i].quote}</p></div>`).join(''):''}<div class="rule"></div><p class="subtle">故事時間會因調查而推進，唔會按你閱讀嘅速度倒數。未查清楚嘅事，可以帶住問題去問。</p>`)};
window.pauseShift=function(){modal('休息一下，個故事會等你',`<p>放低裝置，飲啖水。進度會留喺呢個瀏覽器。</p><p class="subtle">故事涉及債務同情緒困擾。你可以用旁白代替真人演繹，唔使分享自己嘅財務經歷。</p><div class="actions">${btn('準備好，再繼續','window.closeModal()')}</div>`)};

window.completeAll7DaysDemo=function(){enterDemo();s.stage=4;s.budgetDone=true;s.habit=s.habit||'記低一筆支出';s.trigger=s.trigger||'每晚刷牙之後';s.planStart=s.planStart||hkDate();s.complete=false;s.stamps=Array.from({length:7},()=>({date:hkDate(),demo:true}));render();window.fireConfetti()};
window.resetFullDemo=function(){modal('重新開始 V5？','<p>只會清除呢個瀏覽器嘅 V5 進度同打卡。已下載嘅行動卡會保留。</p><div class="actions">'+btn('保留進度','window.closeModal()','secondary')+btn('清除 V4 並重新開始','window.confirmReset()')+'</div>')};
window.confirmReset=function(){if(demo){window.exitDemo();return}try{localStorage.removeItem(KEY)}catch{}s=fresh();window.closeModal();render(true)};
window.aboutGame=function(){modal('關於呢個認領處',`<p>四幕敘事 TRPG：查失物、拼原因、練習同行、帶走一個七日小行動。無擲骰，亦無以一條說話決定一個人嘅生死。</p><p class="subtle">時間係敘事節奏，唔係真實倒數。故事人物、帳單同金額全屬虛構。建議慢慢討論，唔使完成所有自選調查。</p><div class="rule"></div><h3>現實中需要協助？</h3><p>債務輔導：東華三院 2548 0803；明愛 18288。</p><p><a href="https://www.ifec.org.hk/web/tc/moneyessentials/debts-and-borrowing/manage-exist-debt/counselling.page" target="_blank" rel="noopener">投委會：債務輔導服務資料 ↗</a></p><p class="subtle">如遇即時人身危險，應由現場工作人員聯絡緊急服務。角色演繹唔等於專業危機介入。</p><div class="rule"></div><p class="subtle">玩法及記錄方式沿用 V5；聲音偏好獨立儲存。舊版檔案保留。遊戲唔收集銀行資料，亦唔會將行動卡上傳。請自行保管共用裝置嘅紀錄。</p>`)};
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)window.closeModal()}});
render();
</script><script>
/* V4: interludes and persistent consequences. No real messages are sent. */
const branchDefaults=()=>({timeline:[],timelineDone:false,timelineSkipped:false,timelineTries:0,social:'',socialSettled:false,kit:[],kitLocked:false,connection:'',space:false,missteps:[],followup:'',followupDone:false,endingId:'',reviewSeen:[]});
s={...branchDefaults(),...s};
const baseRenderV4=render;
render=function(focus=false){baseRenderV4(focus);if(s.started&&s.stage===2&&!s.social&&Object.keys(s.mini).length){const el=document.createElement('div');el.className='incoming';el.innerHTML='<span>📳 群組有新訊息。</span><button class="textbtn" onclick="window.groupChat()">打開 ↗</button>';$('app').prepend(el)}};
const baseAdvanceV4=window.advanceInvestigation;
const eventTiles=[{id:'pay',time:'02:15',title:'遊戲交易完成',body:'累積十一筆：$8,000',icon:'🎮'},{id:'call',time:'02:03',title:'阿凱來電未接',body:'「你仲未瞓？想搵你傾。」',icon:'📞'},{id:'work',time:'01:40',title:'上司嘅語音',body:'「份嘢又要執，你係咪冇用心？」',icon:'💬'}];
window.advanceInvestigation=function(){if(s.clues.length<4)return notify('仲有失物未整理。');if(!s.timelineDone&&!s.timelineSkipped)return window.timelineGame();baseAdvanceV4()};
window.timelineGame=function(){const selected=s.timeline.map(k=>eventTiles.find(e=>e.id===k)).filter(Boolean);modal('碎屏手機 ／ 三段紀錄',`<div class="kicker">幕間一 · 重組嗰一晚</div><h2>八千蚊之前，<br>發生過啲乜？</h2><p class="subtle">按先後次序點三張紀錄。時間戳幫你排序，唔代表已經知道全部原因。</p><div class="sequence-slots">${[0,1,2].map((_,i)=>`<div class="sequence-slot ${selected[i]?'filled':''}"><small>${i+1}</small><strong>${selected[i]?selected[i].icon+' '+selected[i].time:'？'}</strong>${selected[i]?esc(selected[i].title):'等一條線索'}</div>`).join('')}</div>${eventTiles.filter(e=>!s.timeline.includes(e.id)).map(e=>choice(`${e.icon} ${e.time} · ${e.title}`,`window.addTimeline('${e.id}')`,e.body)).join('')}<div id="timeline-feedback" class="response" role="status"></div><div class="actions">${selected.length===3?btn('接通呢段記憶','window.checkTimeline()'):''}${selected.length?btn('重新排列','window.clearTimeline()','secondary'):''}</div><button class="textbtn" onclick="window.skipTimeline()">先保留疑問，去問親友</button>`)};
window.addTimeline=function(k){if(!eventTiles.some(e=>e.id===k)||s.timeline.includes(k)||s.timeline.length>=3)return;s.timeline.push(k);save();window.timelineGame()};
window.clearTimeline=function(){s.timeline=[];save();window.timelineGame()};
window.checkTimeline=function(){if(s.timeline.join(',')!=='work,call,pay'){s.timelineTries++;save();return feedback('timeline-feedback','將時間由早至遲排。唔使估人格，先看清事件次序。',true)}s.timelineDone=true;s.timelineSkipped=false;save();modal('一條可以追問嘅線',`<div class="kicker">01:40 → 02:03 → 02:15</div><h2>先有委屈，<br>再有未接來電。</h2><div class="response good">你搵到一個可能嘅轉折。課金可能係佢當晚應付壓力嘅方法；要聽佢親口講，先知道係咪。</div><p class="subtle">之後嘅海濱對話，會多一個用呢段紀錄開口嘅方法。</p><div class="actions">${btn('帶住問題，問識佢嘅人','window.leaveTimeline()')}</div>`)};
window.leaveTimeline=function(){window.closeModal();baseAdvanceV4()};
window.skipTimeline=function(){s.timelineSkipped=true;save();window.closeModal();baseAdvanceV4()};

const baseFinishMiniV4=finishMini;
finishMini=function(k,text){baseFinishMiniV4(k,text);if(!s.social){const button=$('modal-body').querySelector('.actions button');if(button){button.textContent='手機又震咗一下';button.setAttribute('onclick','window.groupChat()')}}};
window.afterGroup=function(){window.closeModal();render()};
window.groupChat=function(){if(s.social)return window.showGroupResult();modal('虛構群組 ／ 今晚邊度食',`<div class="kicker">幕間二 · 一個唔只關於錢嘅邀請</div><h2>「阿俊，留咗你位！」</h2><div class="chat-thread"><div class="chat-name">大學同學群組 · 新訊息</div><div class="chat-message">今晚火鍋，每人 $280。<br>你話今次想請大家飲嘢，仲算唔算？</div></div><p class="subtle">阿俊問你點回覆。只係遊戲入面嘅草稿，唔會發送真實訊息。</p>${choice('「今次超咗預算，我飯後同你哋散步得唔得？」',"window.chooseGroup('honest')",'講清界線，提出另一種一齊相處嘅方法。')}${choice('「今晚想休息。聽日我再搵你傾。」',"window.chooseGroup('quiet')",'先留空間，保留之後聯絡嘅機會。')}${choice('「得，我照嚟。」',"window.chooseGroup('promise')",'暫時冇提預算；$280 支出承諾仍然喺度。')}`)};
window.chooseGroup=function(k){if(!['honest','quiet','promise'].includes(k)||s.social)return;s.social=k;s.socialSettled=k!=='promise';save();render();window.showGroupResult()};
window.showGroupResult=function(){const data={honest:['「散步都得，唔使次次請㗎。」','你未有多咗錢，但多咗一個唔靠消費維持關係嘅選擇。'],quiet:['「好，聽日等你訊息。」','今晚保住咗空間。下一步仲要有人再主動聯絡。'],promise:['「OK，留住你位先。」','阿俊放低手機：「其實……我未諗到點畀。」呢筆 $280 會跟住你去聽朝嘅帳目。']}[s.social];if(!data)return;modal('群組回覆',`<div class="chat-thread"><div class="chat-name">同學</div><div class="chat-message">${data[0]}</div></div><div class="response ${s.social==='promise'?'warn':'good'}">${data[1]}</div><div class="actions">${btn('記低呢個後果，繼續調查','window.afterGroup()')}</div>`)};

const baseArriveV4=window.arrive;
window.arrive=function(){if(s.witnesses.length<2||Object.keys(s.mini).length<1)return baseArriveV4();if(!s.social)return window.groupChat();baseArriveV4()};
const kitItems={book:{icon:'📒',name:'三日記帳簿',use:'同佢一齊從下一筆重新開始。'},ledger:{icon:'🧾',name:'分期確認信',use:'對清月供同還款日期。'},phone:{icon:'📱',name:'聯絡備忘卡',use:'由阿俊揀一個願意聯絡嘅人。'},receipt:{icon:'🧋',name:'日常收據',use:'傾清佢想保留嘅生活同關係。'}};
const baseGoV4=window.goPromenade;
window.goPromenade=function(){if(!s.kitLocked)return window.kitGame();baseGoV4()};
window.kitGame=function(){modal('出發前 ／ 放入認領袋',`<div class="kicker">幕間三 · 帶兩件就夠</div><h2>見到佢嗰陣，<br>你想先由邊度傾？</h2><p class="subtle">揀兩件實物放入袋，帶出唔同話題。其餘資料留喺案情簿，唔會遺失。</p><div class="kit-grid">${Object.entries(kitItems).map(([k,e])=>`<button class="kit-item ${s.kit.includes(k)?'selected':''}" aria-pressed="${s.kit.includes(k)}" onclick="window.toggleKit('${k}')"><span>${e.icon}</span><strong>${e.name}</strong><small>${e.use}</small>${s.kit.includes(k)?'<b>✓ 已放入</b>':''}</button>`).join('')}</div><div class="section-foot"><p>認領袋 ${s.kit.length}／2</p>${s.kit.length===2?btn('拎起認領袋，出發','window.confirmKit()'):''}</div>`)};
window.toggleKit=function(k){if(!kitItems[k])return;if(s.kit.includes(k))s.kit=s.kit.filter(x=>x!==k);else if(s.kit.length<2)s.kit.push(k);else return notify('袋入面已有兩件。可以先拎返一件出嚟。');save();window.kitGame()};
window.confirmKit=function(){if(s.kit.length!==2)return;s.kitLocked=true;save();baseGoV4()};

const baseJunV4=junLine;
junLine=function(){if(s.talk===1&&s.space)return '「你肯畀我慢慢講……我其實驚你都覺得我冇用。」';if(s.talk===1&&s.talkOutcome==='sequence')return '「你睇到嗰段紀錄？嗰晚，我真係想有樣嘢由自己控制。」';if(s.talk===2&&s.talkOutcome==='book')return '「你仲帶住本簿？我以為寫唔落去，就唔值得留低。」';if(s.talk>=3&&s.connection==='trusted')return '「我想先搵阿凱。你陪我打第一句得唔得？」';if(s.talk>=3&&s.connection==='written')return '「今晚我仲未講到出口。不過你張卡，我會收好。」';if(s.talk>=3&&s.connection==='self')return '「我想自己試，但聽日可唔可以再問下我？」';return baseJunV4()};
const baseConversationV4=conversation;
conversation=function(){let h=baseConversationV4();const slots=s.kit.map(k=>kitItems[k]).filter(Boolean);const bag=`<div class="bag-strip">${slots.map(e=>`<span>${e.icon} ${e.name}</span>`).join('')}</div>`;h=h.replace('<div class="visual">','<div class="visual">'+bag);if(s.talk===0&&s.talkOutcome!=='repair'&&s.timelineDone)h=h.replace('<p class="subtle">可以先望開畫面',choice('「我見到付款之前有段委屈。你願唔願意講返嗰晚？」',"window.branchTalk('sequence')")+'<p class="subtle">可以先望開畫面');if(s.talk===0&&s.talkOutcome==='repair')h=h.replace('<p class="subtle">可以先望開畫面',choice('「我退後少少。你未想講，可以先唔講。」',"window.branchTalk('space')")+'<p class="subtle">可以先望開畫面');if(s.talk===1&&s.kit.includes('book'))h=h.replace('<p class="subtle">可以先望開畫面',choice('攤開記帳簿：「呢三日，係你試過嘅證據。」',"window.branchTalk('book')")+'<p class="subtle">可以先望開畫面');if(s.talk>=3){const connection=s.connection?`<div class="response good">${s.connection==='trusted'?'阿俊揀咗阿凱。聯絡由佢同意，你陪佢起草第一句。':s.connection==='written'?'你留低一張聯絡卡，同佢約定聽日再問一次。':'你尊重佢想先自己試，約定聽日再聯絡。'}</div>`:'';h=h.replace('<div class="actions">'+btn('坐低，一齊排聽朝','window.beginPlan()')+'</div>',connection+`<div class="actions">${btn(s.connection?'繼續排聽朝':'最後，問一句佢想點行','window.chooseConnection()')}</div>`)}return h};
const baseTalkV4=window.talkChoice;
window.talkChoice=function(k){if(['scold','dismiss','loan'].includes(k)){const marker=s.talk+':'+k;if(!s.missteps.includes(marker))s.missteps.push(marker)}baseTalkV4(k)};
window.branchTalk=function(k){if(k==='sequence'&&s.talk===0&&s.timelineDone){s.talk=1;s.talkOutcome='sequence'}else if(k==='space'&&s.talk===0&&s.talkOutcome==='repair'){s.space=true;s.talk=1;s.talkOutcome='space'}else if(k==='book'&&s.talk===1&&s.kit.includes('book')){s.talk=2;s.talkOutcome='book'}else return;render(true);window.spawnFloatingBadge('你帶嚟嘅線索，派上用場')};
window.chooseConnection=function(){if(s.connection)return window.beginPlan();modal('由阿俊決定下一步',`<div class="kicker">對話之後 · 一個可以接受嘅承諾</div><h2>「今晚，點樣陪你會好啲？」</h2>${choice('陪佢起草畀阿凱嘅訊息',"window.setConnection('trusted')",s.kit.includes('phone')?'你打開聯絡備忘卡，請佢自己揀點開口。':'先問佢同唔同意，再一齊起草。')}${choice('先讓佢自己試，約定聽日再問',"window.setConnection('self')",'尊重自主，將下一次聯絡講清楚。')}${choice('今晚唔勉強佢講，留低書面聯絡卡',"window.setConnection('written')",'對話可以慢慢嚟；約定由可信任嘅人跟進。')}`)};
window.setConnection=function(k){if(!['trusted','self','written'].includes(k))return;s.connection=k;window.closeModal();render(true)};
const baseBeginV4=window.beginPlan;

const baseCashV4=cashflow;

investigation=function(){const heard=s.witnesses.length,solved=Object.keys(s.mini).length;let main='';if(heard<2){main=`<h2>${heard?'再聽另一個角度。':'先揀一個人，聽佢講。'}</h2><p class="intro">${heard?'唔使問晒所有人，先聽兩個就得。':'你問過邊個，會影響之後嘅對話。'}</p><div class="surface witness-list">${witnesses.map((_,i)=>i).filter(i=>!s.witnesses.includes(i)).map(witnessCard).join('')}</div>`}else if(!solved){const w=witnesses[s.witnesses[0]],label={coins:'三張細額收據',shipping:'免運購物車',instalments:'五筆月供',pause:'凌晨付款之前'}[w.mini];main=`<h2>聽過兩個人，<br>而家查清一個疑點。</h2><div class="surface"><div class="kicker">由 ${w.name} 嘅線索開始</div><h3>${label}</h3><p class="subtle">${w.hook}</p><div class="actions">${btn('開始呢個小挑戰',`window.openMini('${w.mini}')`)}</div></div><details class="quiet-options"><summary>想揀另一個疑點？</summary><button class="textbtn" onclick="window.extraMinis()">打開自選調查</button></details>`}else if(!s.social){main=`<h2>手機又有新訊息。</h2><div class="surface"><div class="chat-name">同學群組</div><div class="chat-message">「阿俊，留咗你位！」</div><p class="subtle">幫佢起草一個回覆。你嘅選擇會帶到後面嘅故事。</p><div class="actions">${btn('打開群組邀請','window.groupChat()')}</div></div>`}else{main=`<h2>帶住你知道嘅，<br>去聽佢親口講。</h2><div class="surface"><p>你已聽過 ${heard} 個角度，解開 ${solved} 個帳單疑點。唔使完成所有自選調查。</p><div class="actions">${btn('去見阿俊','window.arrive()')}</div></div>`}return `<section class="focus"><div class="kicker">第二幕 ／ 帳單背後</div>${main}<details class="quiet-options"><summary>自選：重聽證詞／再查線索</summary><div class="extras-body">${witnesses.map((_,i)=>witnessCard(i)).join('')}<div class="actions">${btn('其他帳單疑點','window.extraMinis()','secondary')}${btn('消費提醒卡','window.profiles()','secondary')}</div></div></details></section>`};

planning=function(){if(s.complete||s.budgetDone||(s.social==='promise'&&!s.socialSettled))return priorPlanningV5();const rows=cashflow(),day=Math.min(s.budgetStep,2),r=rows[day],gap=Math.max(0,-Math.min(...rows.map(x=>x.balance)));let controls='';if(day===0)controls=`<fieldset class="budget-options"><legend>先揀一個每日生活安排</legend>${choice('基本安排 · 每日 $42',"window.adjustBudget('basic')",'餐費 $30 ＋ 交通 $12',s.basic)}${choice('保留原安排 · 每日 $73',"window.adjustBudget('comfort')",'餐費 $45 ＋ 交通 $28',!s.basic)}</fieldset><div class="actions">${btn('睇第二日','window.nextBudget()')}</div>`;else if(day===1)controls=`<p>阿俊仲有兩張已持有嘅 $30 飯券，分別可以用喺第一、二日。</p><label class="resource-toggle"><input type="checkbox" ${s.vouchers?'checked':''} onchange="window.adjustBudget('vouchers')"><span><strong>使用兩張現有飯券</strong><small>只減餐費，唔會增加現金。</small></span></label><div class="actions">${btn('再睇出糧嗰日','window.nextBudget()')}${btn('改返生活安排','window.reworkBudget()','secondary')}</div>`;else controls=`<div class="response ${gap?'warn':'good'}">${gap?`Day ${rows.find(x=>x.balance<0).day} 最早唔夠現金，最大缺口 $${gap}。`:`七日每日都有足夠現金，最後剩 $${rows[6].balance}。`}</div><div class="actions">${gap?s.social==='kept'?btn('重新協商聚會承諾','window.reopenSocial()'):btn('返回調整每日安排','window.reworkBudget()'):btn('排好咗，定一個小行動','window.acceptBudget()')}${gap&&(s.delay||s.social==='kept')?btn('保留缺口，先確認支援','window.ackGap()','secondary'):''}</div>${gap?'<p class="subtle">睇返最早唔夠錢嗰日：當時收入到帳未？已有資源用咗未？</p>':''}`;return `<section class="focus budget-guided"><div class="kicker">第四幕 ／ 每次只睇一日</div><h2>${['先排第一日。','第二日，仲夠唔夠？','人工到帳之前，有冇缺口？'][day]}</h2><p class="intro">手上 $50；$600 人工要到 Day ${s.delay?5:3} 先收到。</p><div class="surface"><div class="cash-row"><div><small>Day ${r.day} 日終現金</small><div class="cash ${r.balance<0?'negative':''}">$${r.balance}</div></div><p>餐費 $${r.food-r.voucher}<br>交通 $${r.travel}<br>當日入帳 $${r.income}${r.socialCost?'<br>聚會承諾 $280':''}</p></div>${controls}</div><details class="quiet-options"><summary>想睇完整七日帳目？</summary><button class="textbtn" onclick="window.fullBudget()">打開七日現金流</button><p class="subtle">包括 Day 5 電話費 $50，以及可以自選嘅延遲出糧情境。</p></details></section>`};

</script><script>
/* Original procedural score, generated locally. No downloads or external audio. */
(() => {
  const STORE='lost-found-audio-preferences-v1';
  let prefs={muted:false,music:true,effects:true,musicVolume:20,effectsVolume:35};
  try {const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved){for(const k of ['muted','music','effects'])if(typeof saved[k]==='boolean')prefs[k]=saved[k];for(const k of ['musicVolume','effectsVolume'])if(Number.isFinite(saved[k]))prefs[k]=Math.max(0,Math.min(100,saved[k]));}}catch{}
  let ctx,master,musicBus,effectsBus,timer=null,nextBeat=0,beat=0,activated=false,scene='',unsupported=false,lastClick=0;
  const musicNodes=new Set();
  const scores={
    opening:{bpm:56,chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],melody:[76,null,72,null,69,null,72,null]},
    desk:{bpm:64,chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],melody:[76,null,79,76,null,72,null,74]},
    investigation:{bpm:68,chords:[[57,60,64],[60,64,67],[53,57,60],[55,59,62]],melody:[72,null,76,null,74,null,71,null]},
    seaside:{bpm:52,chords:[[53,57,60],[60,64,67],[57,60,64],[55,59,62]],melody:[72,null,null,69,null,null,67,null]},
    plan:{bpm:60,chords:[[60,64,67],[53,57,60],[57,60,64],[55,59,62]],melody:[72,null,76,null,79,null,76,null]},
    ending:{bpm:54,chords:[[60,64,67],[65,69,72],[60,64,67],[55,59,62]],melody:[79,null,76,null,72,null,null,null]}
  };
  const hz=midi=>440*Math.pow(2,(midi-69)/12);
  const nowScene=()=>!s.started?'opening':s.complete?'ending':['desk','investigation','seaside','plan'][s.stage-1]||'desk';
  function remember(){try{localStorage.setItem(STORE,JSON.stringify(prefs))}catch{}}
  function allowedMusic(){return activated&&ctx&&ctx.state==='running'&&!document.hidden&&!prefs.muted&&prefs.music&&prefs.musicVolume>0}
  function ramp(node,value){if(!ctx||!node)return;node.gain.cancelScheduledValues(ctx.currentTime);node.gain.setTargetAtTime(value,ctx.currentTime,.08)}
  function volumes(){if(!ctx)return;ramp(master,prefs.muted?0:.65);ramp(musicBus,prefs.music&& !document.hidden?prefs.musicVolume/100:0);ramp(effectsBus,prefs.effects&&!document.hidden?prefs.effectsVolume/100:0)}
  async function unlock(){if(unsupported)return;try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){unsupported=true;updateButton();return}ctx=new AC();master=ctx.createGain();musicBus=ctx.createGain();effectsBus=ctx.createGain();const compressor=ctx.createDynamicsCompressor();compressor.threshold.value=-12;compressor.ratio.value=4;musicBus.connect(master);effectsBus.connect(master);master.connect(compressor);compressor.connect(ctx.destination);volumes();}if(ctx.state!=='running')await ctx.resume();activated=ctx.state==='running';updateButton();sync();}catch{activated=false;updateButton()}}
  function tone(midi,at,duration,volume,bus,type='sine',music=false){if(!ctx)return;const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.value=hz(midi);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),at+(music?.12:.009));gain.gain.exponentialRampToValueAtTime(.0001,at+duration);osc.connect(gain);gain.connect(bus);if(music)musicNodes.add(osc);osc.onended=()=>{musicNodes.delete(osc);osc.disconnect();gain.disconnect()};osc.start(at);osc.stop(at+duration+.03)}

const oldCard=planCard;planCard=function(){const h=oldCard();if(!s.arcade||!Object.keys(s.arcade).length)return h;const names=Object.keys(s.arcade).filter(k=>specs[k]).map(k=>specs[k].title).join('、');return h+`<section class="focus surface"><h3>你帶返現實嘅一條線索</h3><p>你試過 ${names}。揀一件最想調整嘅事，寫入上面嘅七日行動。</p><p class="subtle">小遊戲紀錄同樣只存喺本機；遊戲幣唔會增加阿俊嘅戶口餘額。</p></section>`};
