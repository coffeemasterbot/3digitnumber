<section class="wrap lab" id="cashflow">
<header><h2>科大生活 · 現金流試算</h2><p>實習糧未到，飯錢同車費要照畀。改一改到帳日，睇下邊日會唔夠用。</p></header>
<fieldset id="quick-fields"><legend>調整方案 A 嘅收入（港元）</legend></fieldset>
<p id="lab-scenarios" aria-live="polite"></p>

<dl class="lab-metrics" id="lab-summary" aria-live="polite">
  <div><dt>第七日結餘</dt><dd id="lab-closing"></dd></div>
  <div><dt>方案 B 首次唔夠錢</dt><dd id="lab-first-gap"></dd></div>
  <div><dt>方案 B 最大缺口</dt><dd id="lab-max-gap"></dd></div>
</dl>
<figure class="lab-trend"><figcaption>每日結餘比較（HK$）</figcaption><div id="balance-days"></div></figure>
<details id="lab-ledger"><summary>查看每日收支明細</summary>

<div id="lab-table" tabindex="0" role="region" aria-label="每日收支明細，可橫向捲動"></div></details>
<details id="lab-detail"><summary>調整兩個方案同管理紀錄</summary>
<fieldset class="lab-tabs"><legend>選擇要編輯嘅方案</legend><label><input type="radio" name="lab-tab" value="A" checked> 方案 A</label> <label><input type="radio" name="lab-tab" value="B"> 方案 B</label></fieldset>
<fieldset id="lab-income-fields"><legend>收入設定</legend></fieldset>
<fieldset id="lab-expense-fields"><legend>開支及飯券設定</legend></fieldset>
<p><button id="lab-copy">複製 A 到 B</button> <button id="lab-delay">收入延遲兩日</button> <button id="lab-story">複製主線已知安排</button></p>
<p><button id="lab-save">保存 A／B</button> <button id="lab-reset">還原範例</button> <button id="lab-delete">刪除本機方案</button> <button id="lab-export">匯出兩個方案</button></p>
<label>預覽匯入方案 <input id="lab-import" type="file" accept=".json"></label> <button id="lab-confirm" hidden>套用匯入</button> <button id="lab-cancel" hidden>取消匯入</button>
<p id="lab-status" role="status"></p><label>帶去行動卡嘅建議（可以改） <input id="lab-habit" maxlength="120" value="付款前先睇到帳日同到期日"></label> <button data-play="plan" id="lab-action">開啟我的十四日行動卡 →</button></details></section>
