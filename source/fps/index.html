<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>預算防衛戰 · 機械人拆彈任務</title><link rel="icon" href="../../assets/site-icon.svg"><link rel="stylesheet" href="fps.css"></head><body><div id="world" tabindex="0" aria-label="3D訓練場，WASD移動、拖動或鎖定滑鼠瞄準、空白跳、C蹲下、1至4換武器"></div><div id="hud"><button id="pause">Ⅱ 暫停</button><strong>預算防衛戰 <span id="round"></span></strong><span id="health"></span><span id="ammo"></span><span id="timer"></span><span id="money"></span><button id="mute">♫ 聲音：開</button><button id="exit">退出</button></div><div id="objective"></div><div id="crosshair">+</div><div id="scope-view" hidden></div><div id="headshot" role="status" hidden>✦ 爆頭 HEADSHOT</div><div id="hitmarker" hidden>×</div><div id="damage"></div><div id="notice" role="status"></div><div id="defuse"><span id="defuse-label"></span><progress id="defuse-progress" max="5" value="0"></progress></div><div id="menu"></div><div id="terminal" hidden></div><nav id="weapon-bar" aria-label="武器"><button data-weapon="pistol">1 · 手槍</button><button data-weapon="carbine">2 · 步槍</button><button data-weapon="sniper">3 · 狙擊</button><button data-weapon="knife">4 · 匕首</button></nav><div id="touch"><div class="move-pad"><button data-hold="forward">▲</button><button data-hold="left">◀</button><button data-hold="back">▼</button><button data-hold="right">▶</button></div><div class="touch-actions"><button id="look">鎖定滑鼠</button><button id="jump">跳躍</button><button id="crouch" aria-pressed="false">蹲下</button><button id="door">開／關門</button><button id="scope">狙擊開鏡</button><button id="assist">輔助瞄準</button><button data-hold="fire">射擊</button><button id="reload">換彈</button><button id="check">查帳 F</button><button data-hold="defuse">拆解 E</button></div></div><script src="fps.js"></script></body></html>
