<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>預算防衛戰 · 機械人拆彈任務</title><link rel="icon" href="../../assets/site-icon.svg"><link rel="stylesheet" href="fps.css"></head><body><div id="world" tabindex="0" aria-label="3D訓練場，WASD移動、按住右鍵拖動或用方向鍵轉視角、空白跳、C蹲下、1至5換武器"></div><div id="hud"><button id="pause">Ⅱ 暫停</button><strong>預算防衛戰 <span id="round"></span></strong><span id="health-wrap"><span aria-hidden="true">♥</span><progress id="health-bar" max="100" value="100" aria-label="生命值"></progress><span id="health"></span></span><span id="ammo"></span><span id="timer"></span><span id="money"></span><button id="fullscreen" aria-pressed="false">全螢幕 V</button><button id="settings-open" aria-label="開啟設定">⚙ 設定</button><button id="mute">♫ 聲音：開</button><button id="exit">退出</button></div><p id="control-hint">左鍵／X 射擊 · 右鍵拖動／←／→ 轉向 · Q 瞄準</p><output id="view-status" role="status"></output><div id="objective"></div><canvas id="minimap" width="128" height="128" aria-label="小地圖：綠色係你、紅色係機械人、黃色係目標" hidden></canvas><div id="interaction-hint" role="status" hidden></div><div id="crosshair">+</div><div id="scope-view" hidden></div><div id="headshot" role="status" hidden>✦ 爆頭 HEADSHOT</div><div id="hitmarker" hidden>×</div><div id="damage"></div><div class="match-feedback"><div id="notice" role="status"></div><div id="defuse" hidden><span id="defuse-label"></span><progress aria-label="拆彈進度" id="defuse-progress" max="5" value="0"></progress></div></div><div id="menu"></div><div id="terminal" hidden></div><nav id="weapon-bar" aria-label="武器"><button data-weapon="pistol">1 · 手槍</button><button data-weapon="carbine">2 · 步槍</button><button data-weapon="sniper">3 · 狙擊</button><button data-weapon="knife">4 · 匕首</button><button data-weapon="bazooka">5 · 火箭筒</button></nav><div id="touch"><div class="move-pad"><button data-hold="forward">▲</button><button data-hold="left">◀</button><button data-hold="back">▼</button><button data-hold="right">▶</button></div><div class="touch-actions"><button id="jump">跳躍</button><button id="crouch" aria-pressed="false">蹲下</button><button id="door">開／關門</button><button id="scope">瞄準</button><button data-hold="fire">射擊</button><button id="reload">換彈</button><button id="check">查帳 F</button><button data-hold="defuse">拆解 E</button></div></div><dialog id="settings-dialog"><form method="dialog"><div class="settings-title"><div><small>PLAYER SETTINGS</small><h2>調到適合你的手感。</h2></div><button aria-label="關閉設定">×</button></div><label>滑鼠／觸控靈敏度 <output id="sensitivity-output"></output><input id="setting-sensitivity" type="range" min="0.25" max="3" step="0.05"></label><label>開鏡靈敏度 <output id="ads-output"></output><input id="setting-ads" type="range" min="0.2" max="1.5" step="0.05"></label><label>音量 <output id="volume-output"></output><input id="setting-volume" type="range" min="0" max="1" step="0.05"></label><label class="check-setting"><input id="setting-invert" type="checkbox"> 反轉垂直瞄準</label><label class="check-setting"><input id="setting-reduced" type="checkbox"> 減少動態效果</label><p>按住右鍵拖動轉向，放開即停。Esc 暫停。V 切換全螢幕。</p><details><summary>操作說明</summary><p>WASD 移動 · 右鍵拖動／方向鍵轉向 · Esc 暫停 · 左鍵／X 射擊 · Q 瞄準 · 空白跳躍 · C 蹲下 · 1–5 換武器 · R 換彈 · F 查帳 · E 開門／拆解 · P／Esc 暫停 · V 全螢幕。</p><p>觸控板：可用方向鍵轉向、X 射擊、Q 瞄準。手機：左下方向掣移動、右邊拖動瞄準、右下射擊。</p></details><small>FPS build · V4</small><button class="settings-done">完成 · 返回暫停</button></form></dialog><script src="fps.js"></script></body></html>
