<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>預算防衛戰 · 機械人拆彈任務</title><link rel="icon" href="../../assets/site-icon.svg"><link rel="stylesheet" href="fps.css"></head><body><div id="world" tabindex="0" aria-label="3D訓練場，WASD移動、點擊鎖定滑鼠作連續瞄準、空白跳、C蹲下、1至4換武器"></div><div id="hud"><button id="pause">Ⅱ 暫停</button><strong>預算防衛戰 <span id="round"></span></strong><span id="health-wrap"><span aria-hidden="true">♥</span><progress id="health-bar" max="100" value="100" aria-label="生命值"></progress><span id="health"></span></span><span id="ammo"></span><span id="timer"></span><span id="money"></span><button id="fullscreen" aria-label="切換全螢幕">⛶</button><button id="settings-open" aria-label="開啟設定">⚙ 設定</button><button id="mute">♫ 聲音：開</button><button id="exit">退出</button></div><div id="objective"></div><div id="interaction-hint" role="status" hidden></div><div id="aim-gate" hidden><div><h2>點一下，連續轉身。</h2><p>鎖定滑鼠後，轉身唔會受畫面邊界限制。Esc 可暫停及放開游標。</p><button id="aim-start">鎖定滑鼠・繼續</button><button id="aim-fallback">用拖動模式</button></div></div><div id="crosshair">+</div><div id="scope-view" hidden></div><div id="headshot" role="status" hidden>✦ 爆頭 HEADSHOT</div><div id="hitmarker" hidden>×</div><div id="damage"></div><div id="notice" role="status"></div><div id="defuse"><span id="defuse-label"></span><progress aria-label="拆彈進度" id="defuse-progress" max="5" value="0"></progress></div><div id="menu"></div><div id="terminal" hidden></div><nav id="weapon-bar" aria-label="武器"><button data-weapon="pistol">1 · 手槍</button><button data-weapon="carbine">2 · 步槍</button><button data-weapon="sniper">3 · 狙擊</button><button data-weapon="knife">4 · 匕首</button></nav><div id="touch"><div class="move-pad"><button data-hold="forward">▲</button><button data-hold="left">◀</button><button data-hold="back">▼</button><button data-hold="right">▶</button></div><div class="touch-actions"><button id="look">鎖定滑鼠</button><button id="jump">跳躍</button><button id="crouch" aria-pressed="false">蹲下</button><button id="door">開／關門</button><button id="scope">狙擊開鏡</button><button id="assist">輔助瞄準</button><button data-hold="fire">射擊</button><button id="reload">換彈</button><button id="check">查帳 F</button><button data-hold="defuse">拆解 E</button></div></div><dialog id="settings-dialog"><form method="dialog"><div class="settings-title"><div><small>PLAYER SETTINGS</small><h2>調到適合你的手感。</h2></div><button aria-label="關閉設定">×</button></div><label>滑鼠／觸控靈敏度 <output id="sensitivity-output"></output><input id="setting-sensitivity" type="range" min="0.25" max="3" step="0.05"></label><label>開鏡靈敏度 <output id="ads-output"></output><input id="setting-ads" type="range" min="0.2" max="1.5" step="0.05"></label><label>音量 <output id="volume-output"></output><input id="setting-volume" type="range" min="0" max="1" step="0.05"></label><label>滑鼠模式<select id="setting-camera"><option value="free">自由游標 · 拖動畫面環顧</option><option value="locked">鎖定游標 · 連續轉身</option></select></label><label class="check-setting"><input id="setting-invert" type="checkbox"> 反轉垂直瞄準</label><label class="check-setting"><input id="setting-reduced" type="checkbox"> 減少動態效果</label><p>右鍵射擊 · Q 開鏡 · L 切換游標 · V 全螢幕。設定期間遊戲暫停；完成後可按 P 或「繼續任務」。</p><button class="settings-done">完成 · 返回暫停</button></form></dialog><script src="fps.js"></script></body></html>
