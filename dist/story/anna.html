據，喺門罅下面慢慢滑入嚟。|You turn out the light. A slip of paper seems to slide beneath the door.\n查看異夢|Revisit the strange dream\n去警局睇城市地圖|Go to the station to see the map\n酒店異夢|A strange dream at the hotel\n你聽到布料擦過床尾。醒咗之後，窗外已經天光，枕邊多咗一張空白紅色單據。|You hear fabric brush the foot of the bed. By the time you wake, it's daylight and a blank red slip is lying next to your pillow.\n你將單據收好，朝早返去警局。|You put the slip away and return to the station in the morning.\n警局|Police station\n酒店|Hotel\n阿俊嘅屋企|Ah Jun's home\n咖啡店|Café\n一片白色方格|A group of white squares\n過咗一晚，陳警長喺警局攤開地圖。你由同一條街去到阿俊住嘅唐樓。|The next morning, Sergeant Chan spreads out the map. You follow the same street to Ah Jun's walk-up building.\n屋企平面圖|Apartment floor plan\n雪櫃|Fridge\n櫃桶|Drawer\n電腦枱|Desk\n衣櫃|Wardrobe\n房東證詞|Landlord's account\n手機銀行訊息|Phone banking messages\n六張散紙收據|Six small receipts\n殘破記帳本|Damaged budget book\n重看手機訊息|Review the phone messages\n輸入手機密碼|Enter the phone PIN\n核對銀行訊息|Check the banking messages\n去咖啡店|Go to the café\n查齊屋企線索、核對銀行訊息，再完成「預留應急資源」。|Find the clues at home, check the banking messages, then complete “Set aside emergency funds”.\n咖啡店員工休息室|Café staff room\n店長交低備用鎖匙。「佢幾日冇返嚟，入去拎返阿俊啲嘢啦。」|The manager hands over a spare key. “He hasn't been in for days. Go and get Ah Jun's things.”\n休息室有一排儲物櫃，其中一個貼住阿俊名字|A row of staff lockers, one labelled Ah Jun\n阿俊|Ah Jun\n去自修室 C 區 13 號|Go to the study room, Section C, Booth 13\n先查收據同記帳本。|Check the receipts and budget book first.\n自修室 C 區 13 號|Study room · Section C, Booth 13\n地圖上嘅白格原來係自修室包廂。陳警長喺門外等你，阿俊喺入面諗住確認一筆新借款。|The white squares are study booths. Sergeant Chan waits outside. Inside, Ah Jun is about to confirm a new loan.\n只要撳確認，我就可以借到兩萬蚊，清咗之前嘅卡數，撐過今個月。|If I confirm, I can borrow HK$20,000, clear my old card debt and get through this month.\n先聽你講，今晚最擔心啲乜？|Let's hear you out. What are you most worried about tonight?\n叫佢即刻自己處理|Tell him to sort it out immediately\n「我最驚係一停落嚟，就要面對晒所有人。」阿俊願意一齊睇貸款畫面。|“I'm afraid that if I stop, I'll have to face everyone.” Ah Jun agrees to look at the loan terms with you.\n一齊核對帳單，完成結案|Review the bills together and close the case\n試另一句開場|Try a different opening\n門後面靜咗。可以先問阿俊最擔心乜，畀佢時間答你。|It goes quiet behind the door. Ask Ah Jun what worries him most and give him time to answer.\n結案 · 認領返下一步|Case closed · Choose a next step\n門鎖打開。阿俊願意先暫停確認借款，同你一齊逐筆核對帳目。|The door unlocks. Ah Jun agrees to pause the loan application and go through the transactions with you.\n面子消費|Spending to keep up appearances\n對照衣櫃、雪櫃同餐廳單，分開為咗維持形象嘅開支同生活所需。|Compare the wardrobe, fridge and restaurant bill. Separate spending on appearances from everyday needs.\n小額開支|Small expenses\n應急資源|Emergency funds\n先辨認有時限嘅必需開支，再睇有咩資源可以調動。|Identify essential costs with deadlines, then check what funds support them.\n借新還舊|Taking out a loan to repay debt\n比較總還款、成本、日期同支援選擇，先決定下一步。|Compare total repayments, costs, timing and available support before deciding.\n入帳同扣款時間|Timing of credits and debits\n5 號晚入帳，6 號凌晨扣款。要用完整記錄先可以解釋結餘。|The salary arrived on the evening of the fifth. The debits were early on the sixth. A full statement is needed to explain the balance.\n開始七日行動卡|Start the seven-day action card\n回看案情簿|Reopen the case file\n舊手機冇電，屏幕由右上裂開。充電後要輸入六位數字。|The phone is out of power and cracked at the top right. Once charged, it asks for a six-digit PIN.\n查看銀行訊息|View the banking messages\n案情簿等你找到密碼線索。|Find a PIN clue to unlock the next entry in the case file.\n餐廳帳單|Restaurant bill\n便宜意粉|Low-priced pasta\n清水|Water\n1 份|1 serving\n1 杯|1 glass\n印出總額|Printed total\n收據曾經被撕開，菜單只有一份意粉同一杯水。先記低出入。|The bill was torn apart. It lists only one pasta and a glass of water. Note the discrepancy.\n明天就是6號了，一切都會好起來的。|Tomorrow is the sixth. Everything will be all right.\n其他頁都被撕走，句子下面留低一條重重嘅筆痕。|The other pages were torn out. The sentence is heavily underlined.\n雪櫃入面幾乎空晒，剩低一塊發霉嘅麵包同一瓶自來水。|The fridge is nearly empty. There's mouldy bread and a bottle of tap water.\n醫生提示|Doctor's note\n胃藥|Stomach medicine\n止痛藥|Painkiller\n褪黑素|Melatonin\n三瓶都過期。房東可能知道多啲。|All three bottles have expired. The landlord may know more.\n電腦屏幕角落貼住一張黃色便利貼。|A yellow sticky note is attached to the corner of the monitor.\n心心241125，勿忘|Hearts. 241125. Don't forget.\n衣櫃掛住面試用嘅名牌西裝，下面有幾對限量球鞋。屋企嘅日常食物同呢度見到嘅嘢形成對比。|The wardrobe holds a designer interview suit and several pairs of limited-edition trainers. They stand in contrast to the food at home.\n佢以前每月 6 號一早就交租，依家已經欠咗三個月。上個月佢胃痛，想借 $200 睇醫生。|He used to pay rent early on the sixth of each month. He's now three months behind. Last month he had stomach pain and asked to borrow $200 to see a doctor.\n呢段係房東嘅證詞。扣款同出糧時間要以可見記錄核對。|This is the landlord's account. Check the salary and payment times against recorded transactions.\n星巴克咖啡|Starbucks coffee\n便利店飯糰|Convenience-store rice ball\n外賣平台配送費|Food delivery fee\n網購|Online purchase\n影片網站自動續費|Streaming subscription renewal\n的士|Taxi\n六張樣本合計|Total for the six sample receipts\n呢啲係櫃入面搵到嘅樣本。|These samples were found in the locker.\n記帳本|Budget book\n早餐 $10　午餐 $30|Breakfast $10 · Lunch $30\n之後好多頁都留白。中間一頁被用力劃爛。|Many pages after that are blank. One in the middle has been scratched through.\n到底錢花去哪了？？？|Where did all the money go?\n我明明沒買什麼大件啊！|I didn't buy anything expensive!\n這個月又超支了，下個月一定記！|Over budget again. I'll definitely track it next month!\n同事話阿俊經常搶住請客，嗰張餐廳單係佢幫成枱埋單嗰次。|A colleague says Ah Jun often insisted on paying. The restaurant bill was for a meal when he covered the whole table.\n手機上嘅銀行訊息|Banking messages on the phone\n日期|Date\n交易|Transaction\n金額|Amount\n工資入帳|Salary credited\n自動扣款|Automatic debit\n顯示餘額|Displayed balance\n語音備忘錄逐字稿|Voice memo transcript\n為什麼？為什麼我又變回窮光蛋了？明天怎麼面對大家……|Why? Why am I broke again? How am I going to face everyone tomorrow?\n播放廣東話旁白|Play narration\n由呢幾筆訊息，可以得出咩結論？|What can we conclude from these messages?\n$1.50 已經可以由三筆扣款完整解釋。|The three debits fully explain the $1.50 balance.\n推算餘額同畫面唔一致，仲有交易或期初餘額要核對。|The calculated balance differs from the displayed balance. Check other transactions or the opening balance.\n用餐廳單同散紙收據自動補晒差額。|Assume the restaurant bill and receipts account for     [/^飛行距離 ([\d,]+) 米$/, (_,n) => 'Distance flown: '+n+' m'],
    [/^金幣 (\d+) \/ (\d+)$/, (_,n,total) => 'Coins '+n+' / '+total],
    [/^彈匣 (\d+) \/ 備彈 (\d+)$/, (_,mag,reserve) => 'Magazine '+mag+' / Reserve '+reserve],
    [/^換彈 ([\d.]+)s$/, (_,n) => 'Reloading '+n+' s'],
    [/^拉栓 ([\d.]+)s$/, (_,n) => 'Cycling '+n+' s'],
    [/^(\d+) 個機械人活動中$/, (_,n) => n+' active robots'],
    [/^中彈！餘下 (\d+) 生命值。$/, (_,n) => 'Hit! '+n+' health remaining.'],
    [/^([\d.]+) \/ (\d+) 秒$/, (_,n,total) => n+' / '+total+' s'],
    [/^撞到「(.+)」。$/, (_,kind) => 'You hit “'+lookup(kind)+'”.'],
    [/^尚餘 (\d+) 米$/, (_,n) => n+' m to go'],
    [/^剩 (\d+) 秒$/, (_,n) => n+' s left'],
    [/^散紙 × (\d+)$/, (_,n) => 'Change × '+n],
    [/^到達終點前，至少收集 (\d+) 枚金幣。$/, (_,n) => 'Collect at least '+n+' coins before the finish.'],
    [/^\$600 會喺 Day (\d+) 到帳。手上只得 \$50。先排基本生活，唔靠新借貸。$/, (_,n) => 'The $600 pay arrives on day '+n+'. You have $50 today. Plan essentials first without taking out a new loan.'],
    [/^Day (\d+) ／ (人工到帳|人工未到手)$/, (_,n,paid) => 'Day '+n+' / '+lookup(paid)],
    [/^最早 Day (\d+) 出現缺口，最大差 \$([\d.]+)。全週有剩，唔代表每日夠用。$/, (_,day,n) => 'The first gap is on day '+day+' and the largest shortfall is $'+n+'. A positive weekly total can still hide cash shortages.'],
    [/^基本需要同收入日期排好後，七日每日都冇負數，最後剩 \$([\d.]+)。$/, (_,n) => 'The balance stays nonnegative for all seven days, with $'+n+' left after essentials.'],
    [/^(\d+) 號 (\d\d:\d\d)$/, (_,day,time) => 'Day '+day+', '+time],
    [/^第 (\d+) 日到帳$/, (_,day) => 'Paid on day '+day],
    [/^第 (\d+) 日$/, (_,day) => 'Day '+day],
    [/^第 (\d+) 日 · 差 (.+)$/, (_,day,gap) => 'Day '+day+' · short by '+gap],
    [/^第 (\d+) \/ (\d+) 波$/, (_,n,total) => 'Wave '+n+' / '+total],
    [/^第 (\d+)\/(\d+) 波$/, (_,n,total) => 'Wave '+n+' / '+total],
    [/^未解鎖 · (?:第 (\d+) 關|世界 (\d+)) ?開放$/, (_,stage,world) => 'Locked · unlocks in '+(stage?'stage '+stage:'world '+world)],
    [/^(A|B)：(.+)$/, (_,plan,value) => plan+': '+lookup(value)],
    [/^(.+)（HK\$）$/, (_,label) => lookup(label)+' (HK$)'],
    [/^· (.+)$/, (_,label) => '· '+lookup(label)],
    [/^(.+) ·$/, (_,label) => lookup(label)+' ·'],
    [/^(重量|運動|光線) (\d+)$/, (_,temple,n) => lookup(temple)+' '+n],
    [/^([\d.]+)s 下一波$/, (_,n)=>n+' s to next wave'],
    [/^準備 (\d+) 秒$/, (_,n) => 'Prepare: '+n+' s'],
    [/^低頭 · 第 (\d+) 行弱點可攻擊$/, (_,n) => 'Vulnerable · Target the weak point in lane '+n],
    [/^第(\d+)列割草機，(.+)$/, (_,n,state) => 'Lane '+n+' mower, '+lookup(state)],
    [/^([\d,]+) 枚金幣。$/, (_,n) => n+' coins.'],
    [/^本機最佳 (\d+)$/, (_,n) => 'Local best: '+n],
    [/^(\d+ \/ \d+) 已完成$/, (_,n) => n+' completed'],
    [/^固定航線 ([A-Z0-9-]+)$/, (_,id) => 'Seeded route '+id],
    [/^([\d,]+) 點（完成 (\d+) 關解鎖）$/, (_,pts,n) => pts+' pts (unlock after '+n+' missions)'],
    [/^(\d+) 點$/, (_,n) => n+' pts'],
    [/^\/ (\d+) 準備點$/, (_,n) => '/ '+n+' preparation points'],
    [/^代碼 ([A-Z0-9-]+)$/, (_,id) => 'Code '+id],
    [/^三筆扣款合共 (.+)。同 (.+) 再對照一下。$/, (_,total,balance) => 'The debits add up to '+total+'. Compare that with '+balance+'.'],
    [/^已知扣款 (.+)，只按已知入帳同扣款推算餘 (.+)。留低差額，等完整月結單再核對。$/, (_,debits,balance) => 'Known debits total '+debits+'. The recorded salary and debits imply a balance of '+balance+'. Leave the difference unresolved until you have a full statement.'],
    [/^六張收據已有 (.+)。由一筆易漏支出開始記。$/, (_,amount) => 'Six receipts already total '+amount+'. Start by tracking one expense you tend to miss.'],
    [/^收集 (\d+) 陽光$/, (_,n) => 'Collect '+n+' sun'],
    [/^(.+)遊戲實際畫面$/, (_,name) => lookup(name)+' gameplay'],
  ];
  const defaultDuo=name=>name==='火仔'?'Fire':name==='冰仔'?'Ice':name;
  function lookup(value) {
    if (pairs.has(value)) return pairs.get(value);
    for (const [source, translate] of patterns) {
      if (source.test(value)) return value.replace(source, translate);
    }
    if (value.includes(' · ')) return value.split(' · ').map(lookup).join(' · ');
    return value;
  }
  function translate(value) {
    if (language!=='en'||typeof value!=='string'||!/[\u3400-\u9fff]/.test(value)) return value;
    const clean=value.trim();
    const unquoted=clean.startsWith('「')&&clean.endsWith('」')?clean.slice(1,-1):null;
    const result=lookup(clean);
    if(result===clean&&unquoted&&pairs.has(unquoted))return value.replace(clean,'“'+pairs.get(unquoted)+'”');
    return result===clean ? value : value.replace(clean,result);
  }
  const originalText=new WeakMap(),originalAttrs=new WeakMap();
  const localAttrs=['aria-label','aria-valuetext','alt','title','placeholder'];
  function localizeValue(current, saved) {
    const source=saved?.output===current?saved.source:current;
    return {source,output:translate(source)};
  }
  function visit(node) {
    if(node.nodeType===Node.TEXT_NODE){
      if(!node.parentElement||node.parentElement.closest('script,style,textarea,[translate="no"],[contenteditable],.player-name'))return;
      if(node.parentElement.matches('.duo-player-copy strong')&&!['火仔','冰仔'].includes(originalText.get(node)?.source??node.data))return;
      const record=localizeValue(node.data,originalText.get(node));
      if(record.output!==node.data){originalText.set(node,record);node.data=record.output;}
      return;
    }
    if(node.nodeType!==Node.ELEMENT_NODE||node.matches('script,style,[translate="no"]'))return;
    const records=originalAttrs.get(node)??{};
    for(const attr of node.matches('meta[data-brand-meta]')?['content']:localAttrs){
      const current=node.getAttribute(attr);
      if(current===null)continue;
      const record=localizeValue(current,records[attr]);
      if(record.output!==current){records[attr]=record;node.setAttribute(attr,record.output);}
    }
    if(Object.keys(records).length)originalAttrs.set(node,records);
    for(const child of node.childNodes)visit(child);
  }
  function sync() {
    document.documentElement.lang=language==='en'?'en':'zh-HK';
    visit(document.documentElement);
    document.querySelectorAll('[data-site-language]').forEach(button=>{
      button.textContent=language==='en'?'繁體中文':'English';
      button.lang=language==='en'?'zh-HK':'en';
    });
  }
  function use(value,save=false) {
    if(!valid(value)||value===language)return;
    language=value;
    if(save){try{localStorage.setItem(key,value);}catch{}}
    sync();
    window.dispatchEvent(new CustomEvent('site-language-change',{detail:value}));
    for(const frame of document.querySelectorAll('iframe')){
      try{frame.contentWindow?.siteLocale?.use(value);}catch{}
    }
  }
  function write(element,source) {
    const output=translate(source);
    if(element.firstChild?.nodeType!==Node.TEXT_NODE||element.childNodes.length!==1)element.textContent=output;
    else if(element.firstChild.data!==output)element.firstChild.data=output;
    if(element.firstChild)originalText.set(element.firstChild,{source,output});
  }
  window.siteLocale={get language(){return language},text:translate,write,use,set:value=>use(value,true)};
  const observer=new MutationObserver(changes=>{
    if(language!=='en')return;
    for(const change of changes){
      if(change.type==='childList')change.addedNodes.forEach(visit);
      else visit(change.target);
    }
  });
  observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:localAttrs});
  window.addEventListener('storage',event=>{if(event.key===key)use(event.newValue);});
  document.addEventListener('click',event=>{
    if(event.target.closest?.('[data-site-language]'))use(language==='en'?'zh':'en',true);
  });
  document.documentElement.lang=language==='en'?'en':'zh-HK';
  document.addEventListener('DOMContentLoaded',sync,{once:true});
})();
</script>
