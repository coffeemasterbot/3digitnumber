<!doctype html><html lang="zh-HK"><head><script>(function(root,factory){
  if(typeof module==='object')module.exports=factory();
  else root.GardenRules=factory();
})(globalThis,()=>{
const DURATION=24000;
const LEVELS=['基本預算','信用防線','流動資金池','消費壓力','財務風暴'];
const WAVES=5;
const STAGES=[
  {id:'day',world:1,title:'日間 · 陽光儲備'},
  {id:'night',world:2,title:'夜間 · 微光預算'},
  {id:'pool',world:3,title:'水池 · 水上花園'},
  {id:'ice',world:4,title:'冰道 · 分期壓力'},
  {id:'roof',world:5,title:'屋頂 · 機械決戰'}
];
const BOSS={hp:60,exposed:9000,armored:3000,response:6000,minions:3};
function wave(number=1,level=1){
  const surge=number%5===0;
  return {number,level,elapsed:0,clearTime:0,spawnClock:1300,spawned:0,
    total:2+level+Math.floor(number/3)+(surge?2:0),done:false};
}
function step(state,dt,alive,bossAlive=false){
  const events=[];
  if(state.done||!(dt>0))return events;
  state.elapsed+=dt;
  state.spawnClock=Math.max(-dt,state.spawnClock-dt);
  while(state.spawnClock<=0 && state.spawned<state.total && alive+events.length<(state.level===5&&state.number===WAVES?BOSS.minions+Number(bossAlive):12)){
    events.push({type:'spawn',row:(state.number+state.spawned*2)%5,
      giant:state.level===4 && state.number===WAVES && state.spawned===0});
    state.spawned++;
    state.spawnClock+=Math.max(850,1600-state.level*80-state.number*25);
  }
  if(state.spawned===state.total){
    state.clearTime=alive===0&&!events.length?state.clearTime+dt:0;
    if(state.number===WAVES ? state.clearTime>0 : state.elapsed>=DURATION && !(state.level===5&&state.number===WAVES-1&&alive>BOSS.minions)){
      state.done=true;
      events.push({type:state.number===WAVES?'victory':'next'});
    }
  }
  return events;
}
function progress(s,victory=false){return victory?1:Math.min(.999,(s.number-1+Math.min(1,s.elapsed/DURATION))/WAVES)}
function normalize(data){
  if(!data||![1,2,3].includes(data.version)||!Number.isInteger(data.unlocked)||data.unlocked<1||data.unlocked>(data.version===2?15:STAGES.length))throw Error('Invalid garden progress');
  const unlocked=data.version===2?Math.ceil(data.unlocked/3):data.unlocked;
  const legacyRepeater=data.legacyRepeater===true||data.version===1||data.version===2&&(data.seedRules===undefined||data.unlocked>=3);
  return {version:3,unlocked,seedRules:1,legacyRepeater};
}
function campaign(storage){
  const key='garden-campaign-v3';
  let progress=normalize({version:3,unlocked:1});
  try{
    const old=storage.getItem('pvz_gameState');
    if(old&&!storage.getItem('pvz_gameState-pre-campaign'))storage.setItem('pvz_gameState-pre-campaign',old);
    for(const source of [key,'garden-campaign-v2','garden-campaign-v1']){
      const raw=storage.getItem(source);
      if(!raw)continue;
      progress=normalize(JSON.parse(raw));
      if(source!==key)storage.setItem(key,JSON.stringify(progress));
      break;
    }
  }catch{}
  return {level:progress.unlocked,get repeater(){return progress.legacyRepeater||progress.unlocked>=2},get unlocked(){return progress.unlocked},get progress(){return {...progress}},complete(){
    progress.unlocked=Math.max(progress.unlocked,Math.min(STAGES.length,this.level+1));
    try{storage.setItem(key,JSON.stringify(progress))}catch{}
  }};
}
function mowers(){return Array.from({length:5},(_,row)=>({row,x:-34,state:'ready'}))}function stepMowers(list,enemies,dt,width){const kills=[];for(const m of list){if(m.state==='ready'&&enemies.some(e=>e.row===m.row&&e.alive&&e.x<=8))m.state='active';if(m.state==='active'){m.x+=420*dt;for(const e of enemies)if(e.alive&&e.row===m.row&&e.x<=m.x+45){e.alive=false;kills.push(e.id)}if(m.x>width+60)m.state='spent'}}return kills}return {DURATION,WAVES,LEVELS,STAGES,BOSS,normalize,campaign,wave,step,progress,mowers,stepMowers};
});

(() => {
 const targets={defence:[1,2,3].map(n=>'round-'+n),pause:Array.from({length:9},(_,i)=>i+1).map(n=>'temple-'+n),
  instalments:GardenRules.STAGES.flatMap(stage=>Array.from({length:GardenRules.WAVES},(_,j)=>'garden-'+stage.world+'-'+(j+1))),
  shipping:['drill','gravity','blink','mecha','dragon','glider'],coins:['jetpack','pogo','magnet','shoes']};
 window.arcadeDevTargets=targets;
 if(parent===window)return;
 const [version,game,target]=window.name.split('/');
 if(version!=='arcade-test-v1'||!targets[game]?.includes(target))return;
 const data=new Map();
 Object.defineProperty(window,'localStorage',{value:{getItem:k=>data.get(String(k))??null,setItem:(k,v)=>data.set(String(k),String(v)),removeItem:k=>data.delete(String(k)),clear:()=>data.clear(),key:i=>Array.from(data.keys())[i]??null,get length(){return data.size}}});
 const runId=crypto.randomUUID();window.arcadeTest={isTest:true,game,target,runId};
 document.addEventListener('DOMContentLoaded',()=>{
  const banner=document.createElement('aside');banner.style.cssText='position:fixed;z-index:9999;top:0;left:0;padding:2px 6px;background:#542e24;color:white;font:12px system-ui';
  banner.textContent='測試局 · '+target+' · 不記成績 ';for(const [label,action] of [['重啟','restart'],['下一段','next'],['退出','end']]){
   const b=document.createElement('button');b.textContent=label;b.onclick=()=>parent.postMessage({type:'arcade-test-v1',action,game,target,runId},location.origin==='null'?'*':location.origin);banner.append(b)
  }(document.querySelector('dialog[open]')||document.body).append(banner)
 });
})();
</script><script>// One owner per game document. URLs may also be self-contained data URIs.
window.createGameAudio=function(sources,stopLegacyMusic){
  const music=new Map(),effects=new Set(),heard=new Set();
  const storageKey='money-journey-audio-v1',settings={music:.45,effects:.65};
  const clamp=n=>Math.max(0,Math.min(1,n));
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey));
    if(saved&&typeof saved==='object'&&!Array.isArray(saved))
      for(const k of Object.keys(settings))if(Number.isFinite(saved[k]))settings[k]=clamp(saved[k]);
  }catch{}
  let desired=null,current=null,frame=0,unlocked=false,paused=false,disposed=false,position=0;
  function clear(){
    cancelAnimationFrame(frame);
    for(const a of [...music.keys(),...effects])a.pause();
    music.clear();effects.clear();current=null;
  }
  function play(){
    if(disposed||paused||!unlocked||!sources[desired]||current?.id===desired)return;
    stopLegacyMusic?.();
    const a=new Audio(sources[desired]);a.id=desired;a.loop=true;a.volume=0;
    if(position>0)a.currentTime=position;
    current=a;music.set(a,0);a.play().catch(()=>{music.delete(a);if(current===a)current=null});
    cancelAnimationFrame(frame);const start=performance.now(),initial=new Map(music);
    function fade(t){
      const k=clamp((t-start)/350);
      for(const track of music.keys()){
        const gain=track===a?k:(1-k)*(initial.get(track)||0);
        music.set(track,gain);track.volume=gain*settings.music;
        if(k===1&&track!==a){track.pause();music.delete(track)}
      }
      if(k<1)frame=requestAnimationFrame(fade);
    }
    frame=requestAnimationFrame(fade);
  }
  function unlock(){unlocked=true;play()}
  function hidden(){if(document.hidden)api.pause()}
  const api={
    track(id){if(disposed)return;if(id!==desired)position=0;desired=id;if(id==null)clear();else play()},
    effect(id,eventId){
      if(disposed||paused||!unlocked||!sources[id])return;
      if(eventId!=null){const key=id+':'+eventId;if(heard.has(key))return;heard.add(key);if(heard.size>512)heard.delete(heard.values().next().value)}
      if(effects.size>=4||!settings.effects)return;
      const a=new Audio(sources[id]);a.volume=settings.effects;effects.add(a);
      const done=()=>effects.delete(a);a.onended=done;a.onerror=done;a.play().catch(done);
    },
    volume(channel,value){
      if(disposed||!Object.hasOwn(settings,channel)||!Number.isFinite(value))return;
      settings[channel]=clamp(value);
      if(channel==='music'){for(const [a,gain] of music)a.volume=gain*settings.music}
      else for(const a of effects)a.volume=settings.effects;
      try{localStorage.setItem(storageKey,JSON.stringify(settings))}catch{}
    },
    pause(){if(disposed||paused)return;paused=true;position=current?.currentTime||0;clear()},
    resume(){if(disposed)return;paused=false;play()},
    dispose(){disposed=true;clear();heard.clear();document.removeEventListener('pointerdown',unlock,true);document.removeEventListener('keydown',unlock,true);document.removeEventListener('visibilitychange',hidden);window.removeEventListener('pagehide',api.dispose)}
  };
  document.addEventListener('pointerdown',unlock,true);document.addEventListener('keydown',unlock,true);
  document.addEventListener('visibilitychange',hidden);window.addEventListener('pagehide',api.dispose);
  return api;
};
;window.gameAudio=createGameAudio({"garden-picker":"../../assets/game-audio/garden-picker.mp3","garden-1":"../../assets/game-audio/garden-1.mp3","garden-2":"../../assets/game-audio/garden-2.mp3","garden-3":"../../assets/game-audio/garden-3.mp3","garden-4":"../../assets/game-audio/garden-4.mp3","garden-5":"../../assets/game-audio/garden-5.mp3","garden-boss":"../../assets/game-audio/garden-boss.mp3","jet":"../../assets/game-audio/jet.mp3","runner":"../../assets/game-audio/runner.mp3","coin":"../../assets/game-audio/coin.mp3","forest":"../../assets/game-audio/forest.mp3","kill":"../../assets/game-audio/kill.mp3","reload":"../../assets/game-audio/reload.mp3"});</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>散紙追蹤 3D</title><link rel="icon" href="../../assets/site-icon.svg"><link rel="stylesheet" href="style.css"></head><body data-game="runner"><div id="root"></div><script src="app.js"></script><script src="../game-shell.js"></script><link rel="stylesheet" href="../leaderboard.css"><script src="../leaderboard.js"></script></body></html>
